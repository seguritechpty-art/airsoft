# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ============================================================
# 🔑 GOOGLE MAPS API KEY (GRATIS - SKU Maps SDK ilimitado)
# ------------------------------------------------------------
# Crea tu key en https://console.cloud.google.com → APIs & Services
#   → Credentials → Create credentials → API key
# Activa primero: "Maps SDK for Android" en Library.
# Pega aqui tu key (formato: AIzaSy...):
# MAPS_API_KEY=AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
# ============================================================

# 🚀 BACKEND
# ------------------------------------------------------------
# Debug (emulador: 10.0.2.2 → localhost de tu PC)
# API_BASE_URL=http://10.0.2.2:3000
# Para dispositivo fisico usa la IP de tu PC en la red local:
# API_BASE_URL=http://192.168.1.50:3000
# Produccion (servidor desplegado):
# API_BASE_URL_PROD=https://tu-servidor.up.railway.app
# ============================================================